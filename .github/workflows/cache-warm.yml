name: Cache warm

# GitHub Actions 캐시는 PR 스코프에 저장하면 그 PR 만 읽을 수 있고, 다른 PR 은 main(기본
# 브랜치) 스코프 캐시만 읽는다. 키는 ci.yml 쪽과 반드시 같아야 한다: rust-cache 는
# shared-key·프로필, Playwright 는 path·key 식.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  cargo:
    name: warm rust-cache (profile ci)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          workspaces: backend
          shared-key: backend-test
          lookup-only: true

      # 테스트 바이너리까지 빌드해야 dev-dependencies 도 캐시에 들어간다.
      - name: Build test deps (cargo test --no-run)
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test --manifest-path backend/Cargo.toml --profile ci --no-run

  playwright:
    name: warm Playwright chromium
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Look up Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          lookup-only: true

      - uses: actions/setup-node@v4
        if: steps.pw-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'

      - name: Download chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium

      - name: Save Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
