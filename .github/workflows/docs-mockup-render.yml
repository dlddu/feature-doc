# 검사기는 python3 stdlib 만 쓰므로 setup 스텝이 없다.
name: docs — mockup ↔ render

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: 목업 ↔ 구현 화면
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # --verbose 로 돌려서 "무엇이 비교됐는지"가 로그에 남게 한다 — 통과했을 때도
      # 대조된 카피 목록이 보여야 규칙이 공허하지 않다는 것을 확인할 수 있다.
      - name: check mockup ↔ implementation render consistency
        run: python3 tools/check-mockup-render.py --verbose
