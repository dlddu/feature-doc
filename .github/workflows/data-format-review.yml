# 형식을 건드렸을 가능성이 있으면 아무 status 도 붙이지 않는다 — 이 status 는 「그 관점의
# 사람 리뷰는 생략해도 된다」는 적극적 확인이고, 없으면 사람이 본다. 사람이 승인할 때도
# 같은 context 로 success 를 붙인다.
#
# ci.yml 의 `ci-gate` 에 묶지 않는다. 합격/불합격 검사가 아니라 리뷰 라우팅 신호라서,
# 형식이 바뀐 PR 도 이 job 자체는 초록으로 끝난다.
#
# 쓰기 권한 토큰이 주어지는 이벤트이므로 **PR 의 코드는 절대 실행하지 않는다**: base 를
# 체크아웃하고, PR 커밋은 fetch 해서 git diff/show 의 입력(데이터)으로만 쓴다. 이 파일이
# 처음 추가되는 PR 에서는 아예 돌지 않는다.
name: review — data format

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: data-format-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judge:
    name: 데이터 저장 형식 변경 판정
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # base 커밋을 체크아웃한다 — 판정기는 반드시 이쪽 것을 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      # 포크 PR 도 refs/pull/N/head 로 닿는다. 이벤트 이후 PR 이 또 푸시돼 ref 가 앞서 있어도
      # 이 실행은 이벤트의 HEAD_SHA 를 판정한다.
      - name: fetch PR head (data only)
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "${HEAD_SHA}"

      - name: judge
        id: judge
        run: python3 tools/check-data-format-change.py --base "$BASE_SHA" --head "$HEAD_SHA" --verbose

      - name: set commit status (unchanged → success)
        if: steps.judge.outputs.needs_review == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=review/manual-approval \
            -f description="DB 스키마·데이터 저장 형식 변경 없음 (자동 판정)" \
            -f target_url="$RUN_URL" > /dev/null
          echo "review/manual-approval = success → ${HEAD_SHA}"

      - name: note (changed → no status)
        if: steps.judge.outputs.needs_review == 'true'
        run: echo "::notice::저장 형식에 닿는 변경이 있어 review/manual-approval 을 붙이지 않았다 — 사람 리뷰 대상. 근거는 job summary."
