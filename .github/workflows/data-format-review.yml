# 데이터 저장 형식 변경 판정 → 사람 리뷰 필요 여부 신호.
#
# PR 이 DB 스키마나 그 밖에 영속되는 데이터의 형식을 **건드리지 않았다고 판정되면** head
# 커밋에 commit status `review/manual-approval` = success 를 붙인다. 건드렸을 가능성이 있으면
# 아무 status 도 붙이지 않는다 — 이 status 는 "그 관점의 사람 리뷰는 생략해도 된다"는
# 적극적 확인이고, 없으면 사람이 본다. 규칙(D1·D6)과 의도적으로 보지 않는 것은
# `tools/check-data-format-change.py` 헤더에 있다.
#
# status 이름이 `review/manual-approval` 인 이유: 이 레포의 수동 승인 신호는 이것 하나이고
# (econ-opinion-monitor 와 같은 이름), 판정 관점(저장 형식)이 아니라 「사람 승인을 생략해도
# 되는가」라는 신호의 뜻을 이름에 둔다. 사람이 승인할 때도 같은 context 로 success 를 붙인다.
#
# 문서 게이트들과 달리 ci.yml 의 `ci-gate` 에 묶지 않는다. 합격/불합격 검사가 아니라 리뷰
# 라우팅 신호라서, 형식이 바뀐 PR 도 이 job 자체는 초록으로 끝난다.
#
# ── 왜 pull_request_target 인가 ───────────────────────────────────────────
# `pull_request` 로 돌리면 워크플로와 판정기가 **PR 쪽 파일**로 실행된다. 그러면 PR 이
# 판정기를 고쳐 자기에게 success 를 붙일 수 있어, "사람 리뷰를 건너뛰어도 된다"는 신호가
# 무의미해진다. pull_request_target 은 base 브랜치의 워크플로·판정기로 돌므로 그럴 수 없다.
# 그 대가로 쓰기 권한 토큰이 주어지므로 **PR 의 코드는 절대 실행하지 않는다**: base 를
# 체크아웃하고, PR 커밋은 fetch 해서 git diff/show 의 입력(데이터)으로만 쓴다.
# 부수 효과: 이 파일을 바꾸는 PR 에서는 바뀐 판정기가 아니라 main 의 것이 돈다(D6 이
# 그런 PR 을 사람 리뷰로 보낸다). 이 파일이 처음 추가되는 PR 에서는 아예 돌지 않는다.
name: review — data format

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: data-format-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judge:
    name: 데이터 저장 형식 변경 판정
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # base 커밋을 체크아웃한다 — 판정기는 반드시 이쪽 것을 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      # PR 커밋을 객체로만 가져온다(체크아웃하지 않는다). 포크 PR 도 refs/pull/N/head 로 닿는다.
      # 이벤트 이후 PR 이 또 푸시돼 ref 가 앞서 있어도 이 실행은 이벤트의 HEAD_SHA 를 판정한다.
      - name: fetch PR head (data only)
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "${HEAD_SHA}"

      - name: judge
        id: judge
        run: python3 tools/check-data-format-change.py --base "$BASE_SHA" --head "$HEAD_SHA" --verbose

      - name: set commit status (unchanged → success)
        if: steps.judge.outputs.needs_review == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=review/manual-approval \
            -f description="DB 스키마·데이터 저장 형식 변경 없음 (자동 판정)" \
            -f target_url="$RUN_URL" > /dev/null
          echo "review/manual-approval = success → ${HEAD_SHA}"

      - name: note (changed → no status)
        if: steps.judge.outputs.needs_review == 'true'
        run: echo "::notice::저장 형식에 닿는 변경이 있어 review/manual-approval 을 붙이지 않았다 — 사람 리뷰 대상. 근거는 job summary."
