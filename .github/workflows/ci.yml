name: CI

on:
  pull_request:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 새 검사를 추가할 때는 branch protection 을 건드리지 말고 그 job 의 needs 에만 넣는다.
  # `app` 제외 목록에 경로를 더하려면 Dockerfile·.dockerignore·scripts/e2e.sh 가 그 경로를
  # 읽지 않는지 먼저 확인할 것.
  changes:
    name: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      same: ${{ steps.tree.outputs.same }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # diff 가 실패하면 거르지 않고 전부 돌린다.
      - name: Classify changed files
        id: filter
        run: |
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::변경 파일을 구하지 못했다 — 전부 돌린다."
            { echo backend=true; echo app=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          backend=false
          app=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              backend/*|.github/workflows/ci.yml) backend=true ;;
            esac
            case "$f" in
              docs/*|tools/*|.claude/*|README.md) ;;
              .github/workflows/docs-*.yml|.github/workflows/data-format-review.yml) ;;
              .github/workflows/cache-warm.yml|.github/workflows/image.yml) ;;
              *) app=true ;;
            esac
          done <<< "$files"
          echo "$files"
          echo "backend=$backend app=$app"
          { echo "backend=$backend"; echo "app=$app"; } >> "$GITHUB_OUTPUT"

      # 트리 해시는 파일 내용만으로 정해지므로, 머지 트리와 head 트리가 같으면 Docker 빌드
      # 입력이 바이트 단위로 같다 — head 태그를 붙여도 태그와 내용이 어긋나지 않는다.
      - name: Compare merge tree with head tree
        id: tree
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_tree=$(git rev-parse 'HEAD^{tree}')
          parent2=$(git rev-parse 'HEAD^2' 2>/dev/null || true)
          head_tree=$(git rev-parse "${HEAD_SHA}^{tree}" 2>/dev/null || true)
          # HEAD^2 가 이 이벤트의 head 가 아니면(있을 수 없어야 하지만) 다른 것으로 친다.
          if [ "$parent2" = "$HEAD_SHA" ] && [ -n "$head_tree" ] && [ "$merge_tree" = "$head_tree" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "merge ref 트리 = head 트리 ($head_tree) — 테스트한 빌드를 그대로 push 한다."
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::notice::브랜치가 main 보다 뒤처져 merge ref 와 head 의 트리가 다르다 — head 는 head-image job 이 미리 빌드한다."
          fi

  cargo:
    name: test (cargo)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # PR 에서 저장하지 않는 이유 하나 더: 저장소 캐시 한도를 채워 buildx 캐시까지 밀어낸다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-test
          save-if: false

      - name: Test backend (cargo test)
        run: cargo test --manifest-path backend/Cargo.toml --profile ci

  # `workers: 1`(e2e/support/cluster.ts)의 워커 리스는 클러스터 전체 공유 상태다 — 샤드마다
  # 제 kind 를 따로 띄워야 「한 클러스터 안에서 한 번에 한 파일」이 유지된다.
  # fail-fast 를 끄는 이유: 한 샤드가 깨졌다고 다른 샤드를 취소하면 그쪽 결과(같은 원인인지
  # 별개 실패인지)를 잃는다. 어느 쪽이 실패해도 needs.e2e.result 는 failure 라 ci-gate 가 막는다.
  e2e:
    name: test (kind e2e ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # merge ref 로 테스트하는 이유: 브랜치가 뒤처져 있어도 합쳐졌을 때의 결과를 본다.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install kind (arm64)
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-arm64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl (arm64)
        run: |
          KVER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KVER}/bin/linux/arm64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      # 서브셸의 표준 입출력을 끊지 않으면 러너가 이 스텝의 출력이 닫히기를 기다리며 멈춘다.
      - name: Start kind cluster in background
        run: |
          mkdir -p /tmp/bg
          ( kind create cluster --name featuredoc --config deploy/e2e/kind-cluster.yaml --wait 120s \
              >/tmp/bg/kind-create.log 2>&1; echo $? >/tmp/bg/kind-create.rc ) </dev/null >/dev/null 2>&1 &

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # revision 라벨도 merge 커밋이 아니라 태그와 같은 head SHA 로.
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/featuredoc
          tags: |
            type=raw,value=${{ github.event.pull_request.head.sha }}

      # 캐시 저장은 1/2 샤드만 한다 — 두 샤드가 같은 레이어를 같은 스코프에 동시에 쓰면
      # 예약 충돌만 날 뿐 얻는 것이 없다.
      - name: Build e2e image (featuredoc:dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: featuredoc:dev
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: ${{ matrix.shard == 1 && 'type=gha,mode=max' || '' }}

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e deps + Playwright chromium
        working-directory: e2e
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          npm ci
          if [ "$PW_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Wait for kind cluster
        run: |
          timeout 300 bash -c 'until [ -f /tmp/bg/kind-create.rc ]; do sleep 1; done'
          cat /tmp/bg/kind-create.log
          exit "$(cat /tmp/bg/kind-create.rc)"

      - name: e2e (kind → smoke + playwright ${{ matrix.shard }}/2)
        env:
          IMAGE: featuredoc:dev
          SKIP_BUILD: '1'
          SKIP_PLAYWRIGHT_INSTALL: '1'
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/2
        run: bash scripts/e2e.sh

      - name: Wait for cargo job + e2e 2/2
        if: matrix.shard == 1
        id: peers
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100
        run: |
          # 목록에 아직 없는 job 은 pending 으로 쳐서 대기가 통과로 새지 않게 한다.
          targets='{"test (cargo)": ["success", "skipped"], "test (kind e2e 2/2)": ["success"]}'
          for _ in $(seq 1 120); do
            jobs=$(gh api "$RUN_URL") || { sleep 10; continue; }
            verdict=$(jq -r --argjson t "$targets" '
              ([.jobs[] | {key: .name, value: (if .status == "completed" then .conclusion else "pending" end)}]
               | from_entries) as $s
              | [$t | to_entries[] | {name: .key, state: ($s[.key] // "pending"), ok: .value}]
              | (map(select(.state != "pending" and (.state as $c | any(.ok[]; . == $c) | not)))) as $bad
              | if ($bad | length) > 0 then "fail " + ($bad | map("\(.name) = \(.state)") | join(", "))
                elif any(.[]; .state == "pending") then "wait"
                else "ok" end' <<< "$jobs")
            case "$verdict" in
              ok) echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              fail*) echo "::notice::${verdict#fail } — 이미지를 올리지 않는다(ci-gate 가 실패로 판정)."
                     echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::cargo · e2e 2/2 가 20분 안에 끝나지 않았다."; exit 1

      - name: Log in to GHCR
        if: steps.peers.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이 경로의 이미지는 트리가 달라 다시 빌드한 것이라 e2e 를 직접 거치지 않았다.
      - name: Check out head (tree differs)
        if: steps.peers.outputs.ok == 'true' && needs.changes.outputs.same != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 빈 줄은 build-push-action 이 버린다.
      - name: Push image (ghcr, <head sha>)
        if: steps.peers.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            ${{ needs.changes.outputs.same != 'true' && 'type=gha,scope=head' || '' }}
            ${{ needs.changes.outputs.same != 'true' && 'type=gha' || '' }}

  # scope 를 따로 두는 이유: 같은 실행의 e2e 빌드가 기본 scope 의 캐시 인덱스를 나중에
  # 저장하면 head 의 레이어를 가리키는 인덱스가 가려진다.
  head-image:
    name: prebuild head image (behind main)
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.same == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build head image into GHA cache (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=head
            type=gha
          cache-to: type=gha,scope=head,mode=max

  image:
    name: push image (no app change)
    needs: changes
    if: needs.changes.outputs.app == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/featuredoc
          tags: |
            type=raw,value=${{ github.event.pull_request.head.sha }}

      - name: Push image (ghcr, <head sha>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  docs-journey-mockup:
    uses: ./.github/workflows/docs-journey-mockup.yml

  docs-mockup-render:
    uses: ./.github/workflows/docs-mockup-render.yml

  docs-scenario-e2e:
    uses: ./.github/workflows/docs-scenario-e2e.yml

  # changes 필터를 걸지 않는다: 원장을 건드리지 않은 PR 이 주석을 한 줄 더하기만 해도
  # 전수 불변식이 깨지므로, 깨뜨릴 수 있는 PR 집합이 docs/comment-policy 접촉과 다르다.
  comment-ledger:
    name: comment-ledger
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: check comment ledger invariants
        run: python3 scripts/check-comment-ledger.py

  # `always()` 인 이유: 앞 job 이 실패해 이 job 이 skipped 가 되면 GitHub 은 skipped 필수
  # 체크를 통과로 친다. 그래서 항상 돌면서 needs 전부가 success 인지 직접 판정한다.
  # 거르는 job 을 늘리면 SKIP_OK 에도 적을 것.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, cargo, e2e, image, docs-journey-mockup, docs-mockup-render, docs-scenario-e2e,
            comment-ledger]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: all required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP_OK: >-
            {"cargo": "${{ needs.changes.outputs.backend == 'false' }}",
             "e2e": "${{ needs.changes.outputs.app == 'false' }}",
             "image": "${{ needs.changes.outputs.app == 'true' }}"}
        run: |
          echo "$NEEDS" | jq -r --argjson ok "$SKIP_OK" \
            'to_entries[] | "\(.value.result)\t\(.key)\(if $ok[.key] == "true" then "\t(skip 허용)" else "" end)"'
          echo "$NEEDS" | jq -e --argjson ok "$SKIP_OK" \
            'all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and $ok[.key] == "true"))' > /dev/null \
            || { echo "::error::통과로 칠 수 없는 job 이 있다(위 목록)."; exit 1; }
