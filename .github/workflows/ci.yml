name: CI

# PR 에서만 돈다. main push 는 image.yml 이 단독으로 받아 빌드·pin 만 한다.
on:
  pull_request:

permissions:
  contents: read
  packages: write
  # e2e job 이 push 직전에 같은 실행의 cargo job 결과를 조회한다.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cargo test 와 kind e2e 는 서로를 기다릴 이유가 없어 두 job 으로 나란히 돈다.
  # 이미지 push 는 e2e 1/2 샤드의 마지막 단계다 — e2e 가 테스트한 바로 그 이미지를
  # 다시 빌드하지 않고 올리고, cargo 와 e2e 2/2 샤드까지 그린일 때만 올린다.
  #
  # PR 의 필수 상태 체크는 맨 아래 `ci-gate` 하나뿐이다. 새 검사를 추가할 때는
  # branch protection 을 건드리지 말고 그 job 의 needs 에만 넣는다.
  # 무거운 두 job(cargo · e2e)을 PR 이 실제로 건드린 경로로 거른다. 워크플로 레벨
  # `paths:` 를 쓰지 않는 이유: 그러면 `ci-gate` 체크 자체가 생기지 않아 필수 체크가
  # 영원히 pending 이 된다. 그래서 job 레벨 `if:` 로 거르고, ci-gate 는 여기서 「안 돌아도
  # 된다」고 판정한 job 의 skipped 만 통과로 친다.
  #
  # `app` 은 제외 목록이다 — 이미지·e2e 에 닿지 않는다고 확인된 경로만 적고, 나머지(새
  # 디렉터리 포함)는 전부 돌린다. 여기 경로를 더하려면 Dockerfile·.dockerignore·
  # scripts/e2e.sh 가 그 경로를 읽지 않는지 먼저 확인할 것.
  changes:
    name: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # merge ref 의 첫 부모는 그 시점 main 이라, HEAD^1..HEAD 가 「머지되면 실제로 바뀌는
      # 파일」이다. diff 가 실패하면 거르지 않고 전부 돌린다.
      - name: Classify changed files
        id: filter
        run: |
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::변경 파일을 구하지 못했다 — 전부 돌린다."
            { echo backend=true; echo app=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          backend=false
          app=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              backend/*|.github/workflows/ci.yml) backend=true ;;
            esac
            case "$f" in
              docs/*|tools/*|.claude/*|README.md) ;;
              .github/workflows/docs-*.yml|.github/workflows/data-format-review.yml) ;;
              .github/workflows/cache-warm.yml|.github/workflows/image.yml) ;;
              *) app=true ;;
            esac
          done <<< "$files"
          echo "$files"
          echo "backend=$backend app=$app"
          { echo "backend=$backend"; echo "app=$app"; } >> "$GITHUB_OUTPUT"

  cargo:
    name: test (cargo)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # registry 에 더해 target/ 의 의존성 빌드까지 캐시한다. 여기서는 읽기만 한다 —
      # PR 마다 저장하면 저장소 캐시 한도를 채워 buildx 캐시까지 밀어내고, PR 스코프
      # 캐시는 다른 PR 이 읽지도 못한다. 저장은 main push 때 cache-warm.yml 이
      # 같은 shared-key·프로필로 한다(이 워크플로는 main 에서 돌지 않는다).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-test
          save-if: false

      # `--profile ci`(Cargo.toml): dev 기반. release 의 LTO·codegen-units=1 로
      # featuredoc 크레이트만 5분 넘게 컴파일하던 것을 없앤다. 배포 바이너리는
      # 여전히 Dockerfile 에서 release 로 빌드되고 e2e 가 그것을 검증한다.
      - name: Test backend (cargo test)
        run: cargo test --manifest-path backend/Cargo.toml --profile ci

  # Playwright 를 두 샤드로 나눈다. 스펙이 워커 replica 를 리스하는 규칙(workers: 1,
  # e2e/support/cluster.ts)은 「한 클러스터 안에서 한 번에 한 파일」이라, 샤드마다 제
  # 러너에서 kind 를 따로 띄우면 규칙을 건드리지 않고 병렬이 된다. 대가는 러너 시간
  # 한 job 분량(빌드·kind 기동이 두 번).
  #
  # Playwright 는 파일 순서대로 「테스트 개수」를 반으로 자른다(소요 시간이 아니다).
  # 지금은 sc01-01..sc03-03 / sc03-04..sc04-14 로 갈려 약 89s / 70s — 긴 쪽이 1/2 다.
  # push 를 1/2 에 둔 것도 그래서다: 2/2 는 보통 먼저 끝나 있어 대기가 없다.
  #
  # fail-fast 를 끄는 이유: 한 샤드가 깨졌다고 다른 샤드를 취소하면 그쪽 결과(같은 원인인지
  # 별개 실패인지)를 잃는다. 어느 쪽이 실패해도 needs.e2e.result 는 failure 라 ci-gate 가 막는다.
  e2e:
    name: test (kind e2e ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # 테스트는 cargo·docs 와 같은 merge ref(PR + 그 시점 main)로 한다. 브랜치가
      # main 보다 뒤처져 있어도 합쳐졌을 때의 결과를 e2e 가 보게 하려는 것이다.
      # fetch-depth: 2 — 머지 커밋의 두 부모(main, PR head)까지 받아 아래 트리
      # 비교에 쓴다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 이미지 태그는 <head sha> 인데 빌드는 merge ref 로 한다. 둘이 같은 이미지가
      # 되는 조건: 머지 커밋의 트리가 head 의 트리와 같을 때(= 브랜치가 이미 main 을
      # 포함해 합칠 것이 없을 때). 트리 해시는 파일 내용만으로 정해지므로, 같으면
      # Docker 빌드 입력이 바이트 단위로 같다 — 테스트한 빌드를 head 태그로 올려도
      # 태그와 내용이 어긋나지 않는다. 다르면 push 단계에서 head 를 따로 빌드한다.
      - name: Compare merge tree with head tree
        id: tree
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_tree=$(git rev-parse 'HEAD^{tree}')
          parent2=$(git rev-parse 'HEAD^2' 2>/dev/null || true)
          head_tree=$(git rev-parse "${HEAD_SHA}^{tree}" 2>/dev/null || true)
          # HEAD^2 가 이 이벤트의 head 가 아니면(있을 수 없어야 하지만) 다른 것으로 친다.
          if [ "$parent2" = "$HEAD_SHA" ] && [ -n "$head_tree" ] && [ "$merge_tree" = "$head_tree" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "merge ref 트리 = head 트리 ($head_tree) — 테스트한 빌드를 그대로 push 한다."
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::notice::브랜치가 main 보다 뒤처져 merge ref 와 head 의 트리가 다르다 — push 때 head 를 따로 빌드한다."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install kind (arm64)
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-arm64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl (arm64)
        run: |
          KVER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KVER}/bin/linux/arm64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # revision 라벨도 merge 커밋이 아니라 태그와 같은 head SHA 로.
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/featuredoc
          tags: |
            # 커밋 SHA 하나뿐(image.yml 과 같은 규칙). preview 환경이 이 태그를 쓴다.
            type=raw,value=${{ github.event.pull_request.head.sha }}

      # image.yml(main)과 같은 GHA 캐시를 쓴다 — 평범한 `docker build` 는 이 캐시에
      # 닿지 못해 매번 처음부터 빌드했다. 캐시 저장은 1/2 샤드만 한다 — 두 샤드가 같은
      # 레이어를 같은 스코프에 동시에 쓰면 예약 충돌만 날 뿐 얻는 것이 없다.
      - name: Build e2e image (featuredoc:dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: featuredoc:dev
          labels: ${{ steps.meta.outputs.labels }}
          # 로컬 docker 에 load 만 하는 이미지라 provenance attestation 이 필요 없다.
          provenance: false
          cache-from: type=gha
          cache-to: ${{ matrix.shard == 1 && 'type=gha,mode=max' || '' }}

      # 브라우저는 main 에서 cache-warm.yml 이 저장한 것을 읽기만 한다(rust-cache 와
      # 같은 이유로 PR 에서는 저장하지 않는다). 적중하면 다운로드를 건너뛰고 시스템
      # 의존성(apt)만 설치한다. e2e.sh 는 SKIP_PLAYWRIGHT_INSTALL=1 로 설치를 건너뛴다.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e deps + Playwright chromium
        working-directory: e2e
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          npm ci
          if [ "$PW_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: e2e (kind → smoke + playwright ${{ matrix.shard }}/2)
        env:
          IMAGE: featuredoc:dev
          SKIP_BUILD: '1'
          SKIP_PLAYWRIGHT_INSTALL: '1'
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/2
        run: bash scripts/e2e.sh

      # ── push ─────────────────────────────────────────────────────────────────
      # 예전에는 별도 push job(image.yml 호출)이 head SHA 를 다시 체크아웃해 이미지를
      # 새로 빌드했다(merge ref 로 빌드한 e2e 와 캐시가 어긋나 매번 ~76초). 이제
      # 트리가 같으면 e2e 가 통과시킨 바로 그 빌드를 올리고, 다를 때만 head 를 빌드한다.
      # push 는 1/2 샤드만 한다. 「cargo 와 다른 샤드도 그린일 때만」: 둘 다 보통 먼저
      # 끝나 있으므로 이 대기는 사실상 즉시 지나간다.
      - name: Wait for cargo job + e2e 2/2
        if: matrix.shard == 1
        id: peers
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100
        run: |
          # 기다릴 job 과 통과로 치는 결론. cargo 의 skipped = backend 를 건드리지 않아 changes 가
          # 거른 것(main 의 cargo 결과 그대로). e2e 2/2 는 이 job 과 같은 조건으로 돌므로
          # success 만 통과다. 목록에 아직 없는 job 은 pending 으로 쳐서 대기가 통과로 새지 않게 한다.
          targets='{"test (cargo)": ["success", "skipped"], "test (kind e2e 2/2)": ["success"]}'
          for _ in $(seq 1 120); do
            jobs=$(gh api "$RUN_URL") || { sleep 10; continue; }
            verdict=$(jq -r --argjson t "$targets" '
              ([.jobs[] | {key: .name, value: (if .status == "completed" then .conclusion else "pending" end)}]
               | from_entries) as $s
              | [$t | to_entries[] | {name: .key, state: ($s[.key] // "pending"), ok: .value}]
              | (map(select(.state != "pending" and (.state as $c | any(.ok[]; . == $c) | not)))) as $bad
              | if ($bad | length) > 0 then "fail " + ($bad | map("\(.name) = \(.state)") | join(", "))
                elif any(.[]; .state == "pending") then "wait"
                else "ok" end' <<< "$jobs")
            case "$verdict" in
              ok) echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              fail*) echo "::notice::${verdict#fail } — 이미지를 올리지 않는다(ci-gate 가 실패로 판정)."
                     echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::cargo · e2e 2/2 가 20분 안에 끝나지 않았다."; exit 1

      - name: Log in to GHCR
        if: steps.peers.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 트리가 다를 때만: 작업 디렉터리를 head 커밋으로 바꾼다. e2e 는 이미 끝났으므로
      # 덮어써도 된다. 이 경로의 이미지는 예전 push job 과 마찬가지로 e2e 를 직접
      # 거치지 않은 head 빌드다.
      - name: Check out head (tree differs)
        if: steps.peers.outputs.ok == 'true' && steps.tree.outputs.same != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 트리가 같으면 위 e2e 빌드와 입력이 같아 모든 레이어가 builder 의 로컬 캐시에서
      # 나온다 — 재컴파일 없이 export·업로드만. 다르면 GHA 캐시로 head 를 빌드한다.
      - name: Push image (ghcr, <head sha>)
        if: steps.peers.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.tree.outputs.same != 'true' && 'type=gha' || '' }}

  # e2e 가 걸러진 PR(= 이미지 입력이 main 과 같다)에도 preview 환경은 <head sha> 태그를
  # 찾는다. 그 태그를 여기서 올린다 — 소스가 main 과 같으니 GHA 캐시가 통째로 맞는다.
  image:
    name: push image (no app change)
    needs: changes
    if: needs.changes.outputs.app == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/featuredoc
          tags: |
            type=raw,value=${{ github.event.pull_request.head.sha }}

      - name: Push image (ghcr, <head sha>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # 문서 정합성 게이트 3종. 각자 파일에 있고 여기서 부른다 — 실패하면 체크 이름
  # (`docs-… / …`)만으로 어느 칸이 깨졌는지 드러난다. 이미지 push 는 이들을 기다리지 않는다.
  docs-journey-mockup:
    uses: ./.github/workflows/docs-journey-mockup.yml

  docs-mockup-render:
    uses: ./.github/workflows/docs-mockup-render.yml

  docs-scenario-e2e:
    uses: ./.github/workflows/docs-scenario-e2e.yml

  # 유일한 필수 상태 체크. `always()` 인 이유: 앞 job 이 실패해 이 job 이 skipped 가
  # 되면 GitHub 은 skipped 필수 체크를 통과로 친다. 그래서 항상 돌면서 needs 전부가
  # success 인지 직접 판정한다(failure·cancelled 는 실패).
  #
  # skipped 는 SKIP_OK 가 "true" 인 job 에만 허용된다 — changes 가 성공해 「이번 PR 에선
  # 안 돌아도 된다」고 판정한 경우뿐이다. changes 가 실패하면 출력이 비어 전부 "false" 가
  # 되므로 걸러진 job 의 skipped 도 실패로 떨어진다. 거르는 job 을 늘리면 여기에도 적을 것.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, cargo, e2e, image, docs-journey-mockup, docs-mockup-render, docs-scenario-e2e]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: all required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP_OK: >-
            {"cargo": "${{ needs.changes.outputs.backend == 'false' }}",
             "e2e": "${{ needs.changes.outputs.app == 'false' }}",
             "image": "${{ needs.changes.outputs.app == 'true' }}"}
        run: |
          echo "$NEEDS" | jq -r --argjson ok "$SKIP_OK" \
            'to_entries[] | "\(.value.result)\t\(.key)\(if $ok[.key] == "true" then "\t(skip 허용)" else "" end)"'
          echo "$NEEDS" | jq -e --argjson ok "$SKIP_OK" \
            'all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and $ok[.key] == "true"))' > /dev/null \
            || { echo "::error::통과로 칠 수 없는 job 이 있다(위 목록)."; exit 1; }
