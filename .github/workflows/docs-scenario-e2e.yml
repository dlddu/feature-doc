# 이 게이트는 e2e 를 **실행하지 않는다**. spec 이 무엇을 선언하는지만 읽으므로 클러스터도
# node 도 필요 없다(python3 stdlib 만이라 setup 스텝도 없다).
name: docs — scenario ↔ e2e

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: 시나리오 ↔ e2e 1:1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # --verbose 로 돌려서 "무엇이 대조됐는지"가 로그에 남게 한다 — 통과했을 때도
      # 선언·등재 목록이 보여야 규칙이 공허하지 않다는 것을 확인할 수 있다.
      - name: check test scenario ↔ e2e spec consistency
        run: python3 tools/check-scenario-e2e.py --verbose
