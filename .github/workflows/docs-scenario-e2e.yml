# 테스트 시나리오 ↔ e2e 1:1 정합성 게이트.
#
# 형제 워크플로 `docs-journey-mockup.yml` 이 「여정 문서 ↔ 목업 페이지」를,
# `docs-mockup-render.yml` 이 「목업 ↔ 구현 화면」을 본다. 이 워크플로는 그 옆 칸
# 「테스트 시나리오 ↔ e2e spec」을 본다. 셋을 한 잡에 합치지 않는 이유는 실패했을 때
# 어느 칸이 깨졌는지가 잡 이름만으로 드러나게 하기 위해서다.
#
# 형제들과 같이 스스로 트리거되지 않고 ci.yml 이 workflow_call 로 부른다 — 필수 체크를
# `ci-gate` 하나로 모으기 위해서다. 이미지 push 는 이 검사를 기다리지 않는다.
# 이 게이트는 e2e 를 **실행하지 않는다**. spec 이 무엇을 선언하는지만 읽으므로
# 클러스터도 node 도 필요 없다(python3 stdlib 만).
#
# 검사기는 python3 stdlib 만 쓰므로 setup 스텝이 없다. 무엇을 검사하는지는
# `tools/check-scenario-e2e.py` 헤더와 `docs/doc-tracker.md` 「e2e 매핑」에 있다.
name: docs — scenario ↔ e2e

on:
  # ci.yml 에서만 호출된다(단독 트리거 없음).
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: 시나리오 ↔ e2e 1:1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # --verbose 로 돌려서 "무엇이 대조됐는지"가 로그에 남게 한다 — 통과했을 때도
      # 선언·등재 목록이 보여야 규칙이 공허하지 않다는 것을 확인할 수 있다.
      - name: check test scenario ↔ e2e spec consistency
        run: python3 tools/check-scenario-e2e.py --verbose
