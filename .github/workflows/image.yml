name: Image

# 이미지 빌드·push(ghcr) → 운영 매니페스트 pin(`deploy` 브랜치로 발행).
#
# 운영(Flux)은 main 이 아니라 deploy 브랜치를 추적한다. deploy = main@SHA +
# 「두 Deployment 이미지를 그 SHA 로 고정」 커밋 하나. main 은 ruleset(ci-gate)으로
# 보호되어 봇이 되커밋할 수 없고, 그 우회용 장기 크레덴셜도 두지 않는다.
#
# - main push: 단독 트리거. 테스트는 PR(ci.yml)에서 이미 통과했다는 전제로
#   바로 빌드하고 pin 까지 간다.
# - PR: ci.yml 이 테스트 통과 후 workflow_call 로 부른다. 이미지만 <head sha>
#   태그로 올리고 pin 은 건너뛴다.
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  packages: write

# 호출될 때는 ci.yml 의 동시성 그룹 안에서 돈다. 같은 이름을 쓰면 호출자와
# 서로 잡아먹으므로 접두사를 달리한다.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: build & push image (ghcr)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      # PR에서는 기본값이 refs/pull/N/merge(임시 머지 커밋)라 이미지 내용이
      # 태그(head SHA)와 어긋난다. 태그가 가리키는 커밋을 그대로 빌드한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/featuredoc
          tags: |
            # 커밋 SHA 하나뿐. `latest`도, 브랜치 롤링 태그도 만들지 않는다.
            # 운영이 가리키는 태그는 아래 pin job이 커밋으로 옮긴다.
            type=raw,value=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pin:
    name: pin deployment image (main only)
    needs: push
    # main 푸시에서만. PR(ci.yml 이 workflow_call 로 부를 때 event_name 은 호출자의
    # pull_request 다)은 이미지를 <head sha>로 올려두기만 하고(preview 환경이 그
    # 태그를 쓴다) 운영 매니페스트는 건드리지 않는다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      # 이 job만 deploy 브랜치에 push 한다. 워크플로 전체 기본값은 contents: read 유지.
      contents: write
    steps:
      # main 의 HEAD 가 아니라 방금 빌드한 커밋 그대로를 deploy 의 부모로 삼는다.
      # 전체 히스토리는 아래 「더 새 커밋이 이미 발행됐는가」 조상 판정에 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin deploy/k8s image to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          files="deploy/k8s/deployment.yaml deploy/k8s/worker-deployment.yaml"
          sed -i -E "s#^([[:space:]]*image: ghcr\.io/dlddu/featuredoc):.*#\1:${SHA}#" $files

          # sed가 조용히 빗나가지 않았는지 확인: 두 파일 모두 정확히 1줄씩.
          for f in $files; do
            n=$(grep -c "image: ghcr.io/dlddu/featuredoc:${SHA}$" "$f" || true)
            [ "$n" = "1" ] || { echo "::error::$f: expected 1 pinned image line, got $n"; exit 1; }
          done

          # ── deploy 브랜치로 발행 ─────────────────────────────────────────────
          # main 은 ruleset(required status check)으로 보호되어 봇이 직접 커밋할 수 없고,
          # 그러려고 장기 크레덴셜(App 키)을 두지도 않는다. 대신 「main@SHA + 고정 커밋
          # 하나」를 deploy 브랜치로 force-push 하고, Flux 는 deploy 를 추적한다.
          # 기본 GITHUB_TOKEN 의 push 는 새 워크플로를 트리거하지 않고, 어떤 워크플로도
          # deploy 푸시에 걸려 있지 않으므로 재귀가 없다.
          git fetch --no-tags origin +refs/heads/deploy:refs/remotes/origin/deploy 2>/dev/null || true
          old=$(git rev-parse -q --verify refs/remotes/origin/deploy || true)

          # 늦게 끝난 옛 실행이 더 새 배포를 덮지 않게 한다. deploy 끝 커밋의
          # Source-Commit 트레일러가 이 SHA 의 후손이면 이미 앞서 있으니 건너뛴다.
          # (롤백은 main 에 revert PR 을 올리는 것 — 그 머지가 새 SHA 로 다시 여기를 탄다.)
          if [ -n "$old" ]; then
            cur=$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' "$old" | tr -d '[:space:]')
            if [ -n "$cur" ] && [ "$cur" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$cur" 2>/dev/null; then
              echo "deploy 는 이미 더 새로운 main 커밋(${cur})을 가리킨다 — 건너뜀."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -a --allow-empty \
            -m "deploy: featuredoc 이미지를 ${SHA} 로 고정" \
            -m "Source-Commit: ${SHA}"

          # lease 로 「읽은 뒤 누가 먼저 밀었으면」 실패시킨다(old 가 비면 = 브랜치가 없어야 함).
          git push --force-with-lease="refs/heads/deploy:${old}" origin HEAD:refs/heads/deploy
