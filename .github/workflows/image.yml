name: Image

# 제외 목록에 경로를 더하려면 Dockerfile 이 COPY 하지 않고 Flux 가 적용하지도 않는
# 경로인지 먼저 확인할 것.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.dockerignore'
      - '!docs/**'
      - '!tools/**'
      - '!e2e/**'
      - '!scripts/**'
      - '!.claude/**'
      - '!deploy/e2e/**'
      - '!backend/tests/**'
      - '!README.md'
      - '!.gitignore'
      - '!.github/**'
      - '.github/workflows/image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: build & push image (ghcr)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/featuredoc
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pin:
    name: pin deployment image (main only)
    needs: push
    # 이 워크플로는 main push 에서만 돌지만, 운영 매니페스트를 움직이는 job 이라
    # 조건을 한 번 더 명시해 둔다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # 전체 히스토리는 아래 「더 새 커밋이 이미 발행됐는가」 조상 판정에 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin deploy/k8s image to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          files="deploy/k8s/deployment.yaml deploy/k8s/worker-deployment.yaml"
          sed -i -E "s#^([[:space:]]*image: ghcr\.io/dlddu/featuredoc):.*#\1:${SHA}#" $files

          # sed가 조용히 빗나가지 않았는지 확인: 두 파일 모두 정확히 1줄씩.
          for f in $files; do
            n=$(grep -c "image: ghcr.io/dlddu/featuredoc:${SHA}$" "$f" || true)
            [ "$n" = "1" ] || { echo "::error::$f: expected 1 pinned image line, got $n"; exit 1; }
          done

          # 기본 GITHUB_TOKEN 의 push 는 새 워크플로를 트리거하지 않고, 어떤 워크플로도
          # deploy 푸시에 걸려 있지 않으므로 재귀가 없다.
          git fetch --no-tags origin +refs/heads/deploy:refs/remotes/origin/deploy 2>/dev/null || true
          old=$(git rev-parse -q --verify refs/remotes/origin/deploy || true)

          if [ -n "$old" ]; then
            cur=$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' "$old" | tr -d '[:space:]')
            if [ -n "$cur" ] && [ "$cur" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$cur" 2>/dev/null; then
              echo "deploy 는 이미 더 새로운 main 커밋(${cur})을 가리킨다 — 건너뜀."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -a --allow-empty \
            -m "deploy: featuredoc 이미지를 ${SHA} 로 고정" \
            -m "Source-Commit: ${SHA}"

          # lease 로 「읽은 뒤 누가 먼저 밀었으면」 실패시킨다(old 가 비면 = 브랜치가 없어야 함).
          git push --force-with-lease="refs/heads/deploy:${old}" origin HEAD:refs/heads/deploy
