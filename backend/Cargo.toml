[package]
name = "featuredoc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "featuredoc"
path = "src/main.rs"

[[bin]]
name = "featuredoc-worker"
path = "src/bin/worker.rs"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
hex = "0.4"
time = { version = "0.3", features = ["parsing"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
# LTO 와 codegen-units 는 둘 다 바꿔야 줄어든다 — CGU 만 늘리면 쪼갠 만큼 바이너리의
# LTO 가 늘어 합계가 같다.
lto = false

# 디버그 정보를 줄 번호만 남겨도 실패 시 backtrace 의 파일:줄은 그대로 보인다.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
