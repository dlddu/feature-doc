[package]
name = "featuredoc"
version = "0.1.0"
edition = "2021"

# Two binaries out of one crate: the API server and the analysis worker (AC4.5).
# They ship in the same image; the worker Deployment only overrides the command.
[[bin]]
name = "featuredoc"
path = "src/main.rs"

[[bin]]
name = "featuredoc-worker"
path = "src/bin/worker.rs"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
hex = "0.4"
time = { version = "0.3", features = ["parsing"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# CI 의 `cargo test` 전용 프로필. release 의 `lto`·`codegen-units = 1` 은 배포
# 바이너리(Dockerfile)를 위한 것이라, 테스트 바이너리 20여 개마다 LTO 링크를
# 반복하게 만들어 CI 를 몇 분씩 붙잡았다. 테스트 실행 자체는 무시할 만큼 짧으니
# dev 를 기반으로 하고, 링크를 가볍게 하려 디버그 정보는 줄 번호만 남긴다
# (실패 시 backtrace 의 파일:줄은 그대로 보인다).
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
