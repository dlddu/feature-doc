apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# e2e overlay. Retags to the image scripts/e2e.sh builds locally and `kind load`s
# into the node, and forces IfNotPresent — otherwise the node ignores the loaded
# image and tries to pull from GHCR.
resources:
  - ../k8s

images:
  - name: ghcr.io/dlddu/featuredoc
    newName: featuredoc
    newTag: dev

# The base provides no Secret. GitHub creds stay empty here because the doubles
# enabled below never call GitHub.
secretGenerator:
  - name: featuredoc-secrets
    literals:
      - FEATUREDOC_KEK=e2e-stub-kek-not-a-real-secret
      - GITHUB_APP_SLUG=featuredoc
      - GITHUB_CLIENT_ID=
      - GITHUB_CLIENT_SECRET=
      - GITHUB_APP_PRIVATE_KEY=
      - FEATUREDOC_WORKER_TOKEN=e2e-worker-token-not-a-real-secret

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: featuredoc
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: featuredoc
      spec:
        template:
          spec:
            containers:
              - name: app
                imagePullPolicy: IfNotPresent
                env:
                  - name: FEATUREDOC_DOUBLE_GITHUB_AUTH
                    value: "stub"
                  - name: FEATUREDOC_DOUBLE_GITHUB_APP
                    value: "stub"
                  - name: FEATUREDOC_DOUBLE_LLM_KEY
                    value: "stub"
                  - name: FEATUREDOC_DOUBLE_LLM
                    value: "stub"
                  # 빠진 기능 직접 추가(AC3.2)의 근거 찾기는 이 프로세스가 트리를 한 번 더
                  # 스캔한다 — 워커의 1단계와 같은 이름의 변수를 여기서도 읽는다.
                  - name: FEATUREDOC_DOUBLE_REPO_SCAN
                    value: "stub"
                  - name: BASE_URL
                    value: "http://localhost:8080"
                  - name: COOKIE_SECURE
                    value: "false"
  - target:
      kind: Deployment
      name: featuredoc-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: featuredoc-worker
      spec:
        # Off at rest: a running worker drains the queue within a couple of seconds,
        # which would race any spec that asserts a job is still `Queued`. The worker
        # is deployment-wide state — no per-user handle can isolate it — so specs
        # that need it *lease* it: scale up inside their own block, back to 0 in
        # `finally`, with `workers: 1` keeping spec files from overlapping.
        replicas: 0
        template:
          spec:
            containers:
              - name: worker
                imagePullPolicy: IfNotPresent
                # FEATUREDOC_STUB_LLM_FAIL is deliberately NOT set here: sc01-06
                # injects it onto this Deployment inside its own worker lease and
                # removes it afterwards (e2e/support/cluster.ts setWorkerEnv).
                env:
                  - name: FEATUREDOC_DOUBLE_REPO_SCAN
                    value: "stub"
                  - name: FEATUREDOC_DOUBLE_LLM
                    value: "stub"
