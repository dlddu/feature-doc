apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# e2e overlay. Covers both workloads (API + worker). The base (deploy/k8s)
# targets ghcr.io/dlddu/featuredoc at an immutable commit-SHA tag that CI pins —
# correct for production. For kind-based e2e we
# instead want the image scripts/e2e.sh builds locally and `kind load`s into
# the node, so we retag to featuredoc:dev and force IfNotPresent (otherwise the
# node would ignore the loaded image and try to pull from GHCR).
resources:
  - ../k8s

images:
  - name: ghcr.io/dlddu/featuredoc
    newName: featuredoc
    newTag: dev

# Generate the stub-mode secret (the base provides none — see secret.yaml.example):
# a deterministic e2e KEK; GitHub creds stay empty since stub mode never calls
# GitHub. Run mode + base URL + cookie flag are non-secret env, overridden below.
secretGenerator:
  - name: featuredoc-secrets
    literals:
      - FEATUREDOC_KEK=e2e-stub-kek-not-a-real-secret
      - GITHUB_APP_SLUG=featuredoc
      - GITHUB_CLIENT_ID=
      - GITHUB_CLIENT_SECRET=
      - GITHUB_APP_PRIVATE_KEY=
      # Shared by the API (to authenticate /internal) and the worker (to call it).
      - FEATUREDOC_WORKER_TOKEN=e2e-worker-token-not-a-real-secret

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: featuredoc
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: featuredoc
      spec:
        template:
          spec:
            containers:
              - name: app
                imagePullPolicy: IfNotPresent
                # Stub mode, http cookies, local base URL (merged by env name).
                env:
                  - name: FEATUREDOC_MODE
                    value: "stub"
                  - name: BASE_URL
                    value: "http://localhost:8080"
                  - name: COOKIE_SECURE
                    value: "false"
  - target:
      kind: Deployment
      name: featuredoc-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: featuredoc-worker
      spec:
        # Off at rest. A running worker drains the queue within a couple of
        # seconds, which would race any spec that asserts a job is still `Queued`
        # (ac1-1 does). The worker is deployment-wide state — unlike App
        # installs and LLM keys, no per-user handle can isolate it — so it is
        # *leased*: a spec that needs it (ac4-5, ac1-5) scales it up inside its
        # own block and returns it to 0 in `finally`, and `workers: 1` keeps
        # spec files from overlapping. See docs/doc-tracker.md "e2e 매핑".
        replicas: 0
        template:
          spec:
            containers:
              - name: worker
                imagePullPolicy: IfNotPresent
                # Stub mode: repo_scan answers from the deterministic stub set, so
                # the worker never reaches GitHub from kind.
                env:
                  - name: FEATUREDOC_MODE
                    value: "stub"
