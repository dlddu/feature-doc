apiVersion: apps/v1
kind: Deployment
metadata:
  name: featuredoc
  labels:
    app.kubernetes.io/name: featuredoc
spec:
  replicas: 1
  strategy:
    # SQLite on a ReadWriteOnce volume: never let two pods mount it at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: featuredoc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: featuredoc
    spec:
      containers:
        - name: app
          # ⚙️ CI가 관리하는 줄입니다. main에 푸시가 들어오면 ci.yml의 `pin` job이
          # 이미지 빌드를 마친 뒤 이 태그를 그 커밋의 SHA로 바꿔 다시 커밋합니다.
          # 손으로 고칠 일은 롤백뿐이고, 그때는 되돌릴 커밋의 SHA를 적으면 됩니다.
          image: ghcr.io/dlddu/featuredoc:4c2124c8a1829f4cf41957b643974297949d5507
          # imagePullPolicy intentionally omitted: the tag is an immutable commit
          # SHA, so the default IfNotPresent is correct — a cached layer can never
          # be stale, and a rollout only happens when the tag above changes.
          # (The e2e overlay in deploy/e2e/ retags this to featuredoc:dev.)
          ports:
            - containerPort: 8080
              name: http
          env:
            # SQLite lives on the mounted PVC; created + migrated on first boot.
            - name: DATABASE_URL
              value: "sqlite:///data/featuredoc.db?mode=rwc"
            # Non-secret runtime config (the e2e overlay patches these).
            - name: FEATUREDOC_MODE
              value: "real"
            - name: BASE_URL
              value: "https://featuredoc.example.com"
            - name: COOKIE_SECURE
              value: "true"
          envFrom:
            # Secrets only: KEK + GitHub App credentials.
            - secretRef:
                name: featuredoc-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            # /hello only answers after migrations apply at startup.
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: featuredoc-data
