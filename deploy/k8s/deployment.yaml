apiVersion: apps/v1
kind: Deployment
metadata:
  name: featuredoc
  labels:
    app.kubernetes.io/name: featuredoc
spec:
  replicas: 1
  strategy:
    # SQLite on a ReadWriteOnce volume: never let two pods mount it at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: featuredoc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: featuredoc
    spec:
      containers:
        - name: app
          # ⚙️ CI가 관리하는 줄입니다. 운영 값은 **deploy 브랜치**의 이 줄입니다 —
          # main에 푸시가 들어오면 image.yml의 `pin` job이 이 태그를 그 커밋의 SHA로
          # 바꾼 커밋을 deploy로 발행하고, Flux는 deploy를 추적합니다. main에 남은 값은
          # 운영과 무관합니다. 손으로 고칠 일은 없습니다(롤백은 main에 revert PR).
          image: ghcr.io/dlddu/featuredoc:1c39ba2566dcd8a4ff5f18c1ec90dea4601e9922
          # imagePullPolicy intentionally omitted: the tag is an immutable commit
          # SHA, so the default IfNotPresent is correct — a cached layer can never
          # be stale, and a rollout only happens when the tag above changes.
          ports:
            - containerPort: 8080
              name: http
          env:
            # SQLite lives on the mounted PVC; created + migrated on first boot.
            - name: DATABASE_URL
              value: "sqlite:///data/featuredoc.db?mode=rwc"
            # Every external boundary runs for real here: the test doubles are
            # opt-in per boundary (FEATUREDOC_DOUBLE_*, set only by the e2e
            # overlay), so a production deployment enables none by saying nothing.
            - name: BASE_URL
              value: "https://featuredoc.example.com"
            - name: COOKIE_SECURE
              value: "true"
          envFrom:
            - secretRef:
                name: featuredoc-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            # /hello only answers after migrations apply at startup.
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: featuredoc-data
